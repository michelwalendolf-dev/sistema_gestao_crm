<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Verificar código</title>
    <link rel="stylesheet" href="../assets/css/recuperacao.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
<div class="container">
    <h2>Verificação de Segurança</h2>
    <hr class="divider">
    <div class="info" style="margin-bottom:25px;">
        <p style="margin-bottom:8px;">
            Para continuar, informe o código enviado para:
        </p>
        <p style="font-weight:600; font-size:15px; opacity:0.9;">
            <span id="emailUsuario"></span>
        </p>
        <br>
        <div>
            <p style="opacity:0.9;">
                Por segurança, nunca compartilhe este código com ninguém.
                A equipe da IluminusTech nunca solicitará este código.
            </p>
        </div>
    </div>
    <form id="formVerificar">
        <div class="codigo-boxes">
            <input class="codigo-box" type="text" maxlength="1" inputmode="numeric" pattern="[0-9]*" autocomplete="off" />
            <input class="codigo-box" type="text" maxlength="1" inputmode="numeric" pattern="[0-9]*" autocomplete="off" />
            <input class="codigo-box" type="text" maxlength="1" inputmode="numeric" pattern="[0-9]*" autocomplete="off" />
            <input class="codigo-box" type="text" maxlength="1" inputmode="numeric" pattern="[0-9]*" autocomplete="off" />
            <input class="codigo-box" type="text" maxlength="1" inputmode="numeric" pattern="[0-9]*" autocomplete="off" />
            <input class="codigo-box" type="text" maxlength="1" inputmode="numeric" pattern="[0-9]*" autocomplete="off" />
            <input type="hidden" name="codigo" id="codigoCompleto" />
        </div>
        <button class="btn">Validar Código</button>
    </form>
    <div class="reenviar">
        <span id="contador">Reenviar código em 35s</span><br>
        <a id="reenviarBtn" href="#">Solicitar novo código</a>
    </div>
    <div style="margin-top:22px; font-size:13px; opacity:0.6; text-align:center;">
        Não recebeu o código? Verifique sua caixa de spam.
    </div>
</div>


<script>
(function () {
    const boxes = document.querySelectorAll('.codigo-box');
    const hidden = document.getElementById('codigoCompleto');

    function atualizarHidden() {
        hidden.value = Array.from(boxes).map(b => b.value).join('');
    }

    boxes.forEach((box, i) => {
        box.addEventListener('input', (e) => {
            const val = e.target.value.replace(/[^0-9]/g, '');
            box.value = val ? val[val.length - 1] : '';
            box.classList.toggle('preenchido', box.value !== '');
            atualizarHidden();
            if (box.value && i < boxes.length - 1) {
                boxes[i + 1].focus();
            }
        });

        box.addEventListener('keydown', (e) => {
            if (e.key === 'Backspace') {
                if (box.value) {
                    box.value = '';
                    box.classList.remove('preenchido');
                    atualizarHidden();
                } else if (i > 0) {
                    boxes[i - 1].focus();
                    boxes[i - 1].value = '';
                    boxes[i - 1].classList.remove('preenchido');
                    atualizarHidden();
                }
            } else if (e.key === 'ArrowLeft' && i > 0) {
                boxes[i - 1].focus();
            } else if (e.key === 'ArrowRight' && i < boxes.length - 1) {
                boxes[i + 1].focus();
            }
        });

        box.addEventListener('paste', (e) => {
            e.preventDefault();
            const text = (e.clipboardData || window.clipboardData)
                .getData('text')
                .replace(/[^0-9]/g, '')
                .slice(0, 6);
            text.split('').forEach((char, j) => {
                if (boxes[j]) {
                    boxes[j].value = char;
                    boxes[j].classList.add('preenchido');
                }
            });
            atualizarHidden();
            const next = boxes[Math.min(text.length, boxes.length - 1)];
            if (next) next.focus();
        });
    });

    boxes[0].focus();
})();
</script>

<script src="../assets/js/script.js" defer></script>
</body>
</html>
